[package]
name = "logic_parser"
version = "0.1.0"
authors = ["Alina Yemets"]
edition = "2021"
description = "Logic Parser: simple logical and predicate expression parser in Rust with variables, predicates, quantifiers (∀, ∃), and operators NOT, AND, OR, ->, <->."

[dependencies]
anyhow = "1.0.100"
pest = "2.8.3"
pest_derive = "2.8.3"
thiserror = "1.0"
